[advisories]
# syntect 5.3 uses bincode 1.3 only for compiled syntax-set data and yaml-rust
# to load its bundled syntax definitions. These advisories report upstream
# maintenance status, not vulnerabilities, and syntect has no safe upgrade.
ignore = ["RUSTSEC-2024-0320", "RUSTSEC-2025-0141"]

[licenses]
confidence-threshold = 0.8
allow = [
    "0BSD",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
    "https://github.com/borg-ml/blu.git",
    "https://github.com/borg-ml/claude-agents.git",
]
