[advisories]
# syntect 5.3 uses bincode 1.3 only for compiled syntax-set data. The advisory
# reports upstream maintenance status, not a vulnerability, and bincode has no
# maintained 1.x replacement that syntect can adopt without a format change.
ignore = ["RUSTSEC-2025-0141"]

[licenses]
confidence-threshold = 0.8
allow = [
    "0BSD",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
