[advisories]
# These advisories report upstream maintenance status, not vulnerabilities,
# and currently have no safe upgrade. The first two come through syntect; the
# remaining entries are transitive dependencies of GPUI (paste is also used by
# image codecs shared with the TUI).
ignore = [
    "RUSTSEC-2024-0320",
    "RUSTSEC-2025-0141",
    "RUSTSEC-2025-0052",
    "RUSTSEC-2024-0384",
    "RUSTSEC-2024-0436",
    "RUSTSEC-2026-0173",
    "RUSTSEC-2025-0134",
    "RUSTSEC-2026-0206",
    "RUSTSEC-2026-0192",
]

[licenses]
confidence-threshold = 0.8
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "NCSA",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
    "https://github.com/borg-ml/blu.git",
    "https://github.com/borg-ml/claude-agents.git",
]
