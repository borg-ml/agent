# Place manifests in .borg/extensions/*.toml (project) or
# $XDG_CONFIG_HOME/borg/extensions/*.toml (user). Project manifests require
# [extensions].allow_project_mcp = true in the user's agent config before any
# MCP command is eligible to start. Borg does not execute shell hooks or
# lifecycle scripts. skill_roots are catalog metadata only; they are not loaded
# or executed by this release.
manifest_version = 1
id = "docs"
version = "1.0.0"
enabled = true
required_capabilities = ["multiplayer"]
skill_roots = ["skills"]

[mcp.search]
command = "docs-mcp"
args = ["serve"]
allowed_tools = ["search", "read"]
