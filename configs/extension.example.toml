# Blu package manifest (`blu.toml`)
#
# Install packages under `.borg/extensions/<id>/` (project) or
# `$XDG_CONFIG_HOME/borg/extensions/<id>/` (user). Legacy flat
# `extensions/*.toml` manifests remain supported. Project packages are
# cataloged but inactive until the user enables
# `[extensions].allow_project_mcp = true` in agent.toml.
#
# Blu is declarative: packages may contribute skill roots and stdio MCP
# servers, but never opaque shell/lifecycle hooks. Borg validates paths,
# dependencies, versions, settings, and server declarations before activation.
manifest_version = 1
id = "docs"
name = "Documentation tools"
version = "1.0.0"
description = "Search and read the project's documentation index."
enabled = true
borg_version = ">=0.1.34"
required_capabilities = ["multiplayer"]
skill_roots = ["skills"]

# Dependencies are extension ids mapped to semantic-version requirements.
# Borg loads dependencies first and isolates missing, incompatible, or cyclic
# packages instead of starting a partial graph.
[dependencies]
# shared-foundation = "^2.0"

# Typed settings live outside the package in `.borg/blu.toml` or the user
# `$XDG_CONFIG_HOME/borg/blu.toml`, so packages remain immutable and updateable.
# Values can be interpolated as `${config.index}`. Secret values are redacted
# by `borg extensions` and state files are written with mode 0600 on Unix.
[config.index]
type = "string"
description = "Documentation index to open"
default = "main"

[config.token]
type = "string"
description = "Optional private index token"
secret = true
required = false

[mcp.search]
command = "docs-mcp"
args = ["serve", "--index", "${config.index}"]
# Environment variables can also be referenced without persisting them:
# env = { DOCS_TOKEN = "${env.DOCS_TOKEN}" }
allowed_tools = ["search", "read"]
