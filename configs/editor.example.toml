# Copy to $XDG_CONFIG_HOME/borg/editor.toml (usually
# ~/.config/borg/editor.toml). Changes made through /settings, /followups,
# /refresh, and the related pickers are written to this file automatically.

[interaction]
# Enter steers the active turn at Codex's next model/tool boundary. Use
# "queue" to make Enter always start a later turn. The queue keybinding in
# agent.toml remains an explicit next-turn queue in either mode.
active_messages = "steer"
# Keep the machine awake while a turn is active. On systemd Linux this also
# prevents the desktop from handling a lid close during the turn; use
# `/sleep off` or set this to false if the laptop should suspend when closed.
prevent_sleep = true
# Independently choose when Borg sends a desktop notification and plays the
# terminal alert sound after finishing a turn. Valid values: off, unfocused, always.
completion_notifications = "unfocused"
completion_sound = "unfocused"

[presentation]
# Interface labels only; independent of the model response language selected
# by /language. Valid values: auto, en, zh-Hans, es, ru.
ui_language = "auto"
refresh_rate_fps = 60
diff_expansion = "expanded" # expanded | collapsed | until_next_action
auto_expand_tools = false
# Show the short "Generating edit…" descriptor while a tool call is assembled.
action_descriptors = true
# Omit to choose the microphone icon on first use. Valid values: nerd_font, emoji.
# dictation_icon = "nerd_font"

[layout]
horizontal_margin = 0
composer_max_height = 8
show_footer = true

[transcript]
user_label = "user"
assistant_label = "borg"
user_label_color = "#4aa3ff"
user_message_color = "#c6e4ff"
assistant_label_color = "#ff8e24"
assistant_message_color = "#ffffff"
