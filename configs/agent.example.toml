# Copy to $XDG_CONFIG_HOME/borg/agent.toml (usually ~/.config/borg/agent.toml)
# or pass `borg agent --config PATH`.
#
# Aliases expand to built-in slash commands. They do not execute shell code,
# load plugins, or register lifecycle hooks.

# Optional Borg subsystems. Defaults preserve the current full-featured
# experience. Disabling a parent automatically makes dependent features
# inactive: autonomous_team depends on subagents; shared_work and presence
# depend on multiplayer; web_relay depends on cloud_sync.
[capabilities]
multiplayer = true
subagents = true
autonomous_team = true
shared_work = true
presence = true
cloud_sync = true
web_relay = true
telemetry = false
# `shared_work`, `presence`, `cloud_sync`, `web_relay`, and `telemetry` are
# reserved provider-neutral declarations in this CLI release. They do not
# initialize a runtime or register tools yet.

# Project-local extension manifests are untrusted by default because they can
# declare stdio MCP commands. User-owned manifests remain eligible to start.
[extensions]
allow_project_mcp = false

# Team concurrency applies to manual and autonomous subagents. Borg defaults
# to 16; lower it here for smaller machines or tighter provider budgets.
# [team]
# worker_concurrency = 16
#
# The remaining settings opt into autonomous-team policy. Omit `preset` to
# preserve ordinary manual launches and inherited model/effort settings.
# The preset takes effect only while `autonomous_team` is effective. It gives
# the root xhigh effort when no --effort was supplied, gives spawned workers
# low effort unless their tool request overrides it, and bounds concurrent
# workers. Cost is integer micro-USD to avoid floating-point ambiguity.
# preset = "xhigh_director_low_workers"
# max_total_assignments = 1000
# max_total_reports = 2000
# max_total_escalations = 100
# max_specialists = 100
# max_tokens = 200000
# max_cost_microusd = 500000
# max_wall_time_ms = 3600000

[commands.aliases]
quick = "/fast on"
normal = "/fast off"
deep = "/effort xhigh"

# Actions can have one or more key chords. Supported modifiers are ctrl, alt,
# and shift. Omitted actions keep their defaults.
[keybindings]
send = ["enter"]
queue = ["tab"]
newline = ["shift+enter", "alt+enter"]
keybindings = ["?"]
interrupt = ["esc"]
clear_or_exit = ["ctrl+c"]
exit = ["ctrl+d"]
attach_image = ["ctrl+v"]
copy = ["ctrl+y"]
scroll_up = ["pageup"]
scroll_down = ["pagedown"]
select_previous = ["alt+up"]
select_next = ["alt+down"]
approve = ["y"]
deny = ["n", "esc"]

# Add any local stdio MCP server as a provider-neutral tool extension. Borg
# starts enabled servers for the active session and exposes them to Codex,
# Claude, and the native harness. Empty allowed_tools exposes every
# tool advertised by the server.
#
# [mcp.servers.docs]
# command = "npx"
# args = ["-y", "@example/docs-mcp"]
# env = { DOCS_TOKEN = "replace-me" }
# allowed_tools = ["search", "read"]
#
# [mcp.servers.experimental]
# enabled = false
# command = "./target/debug/my-borg-tools"

# Auto approval uses the active model by default. Set a dedicated reviewer to
# trade model quality, latency, and cost independently from the acting agent.
[approvals]
# reviewer_model = "openai/gpt-5-mini"
# reviewer_effort = "low"

# Stable releases are verified and installed in the background for the next
# launch. Active sessions are never restarted. If this fails, Borg keeps a
# durable notice and prompts for `borg update`.
[updates]
auto_install = true
check_interval_hours = 24
