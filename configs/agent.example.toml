# Copy to $XDG_CONFIG_HOME/borg/agent.toml (usually ~/.config/borg/agent.toml)
# or pass `borg agent --config PATH`.
#
# Aliases expand to built-in slash commands. They do not execute shell code,
# load plugins, or register lifecycle hooks.

[commands.aliases]
quick = "/fast on"
normal = "/fast off"
deep = "/effort xhigh"

# Actions can have one or more key chords. Supported modifiers are ctrl, alt,
# and shift. Omitted actions keep their defaults.
[keybindings]
send = ["enter"]
queue = ["tab"]
newline = ["shift+enter", "alt+enter"]
keybindings = ["?"]
interrupt = ["esc"]
clear_or_exit = ["ctrl+c"]
exit = ["ctrl+d"]
attach_image = ["ctrl+v"]
copy = ["ctrl+y"]
scroll_up = ["pageup"]
scroll_down = ["pagedown"]
select_previous = ["alt+up"]
select_next = ["alt+down"]
approve = ["y"]
deny = ["n", "esc"]

# Add any local stdio MCP server as a provider-neutral tool extension. Borg
# starts enabled servers for the active session and exposes them to Codex,
# Claude, OpenCode, and the native harness. Empty allowed_tools exposes every
# tool advertised by the server.
#
# [mcp.servers.docs]
# command = "npx"
# args = ["-y", "@example/docs-mcp"]
# env = { DOCS_TOKEN = "replace-me" }
# allowed_tools = ["search", "read"]
#
# [mcp.servers.experimental]
# enabled = false
# command = "./target/debug/my-borg-tools"

# Auto approval uses the active model by default. Set a dedicated reviewer to
# trade model quality, latency, and cost independently from the acting agent.
[approvals]
# reviewer_model = "openai/gpt-5-mini"
# reviewer_effort = "low"

# Stable releases are verified and installed in the background for the next
# launch. Active sessions are never restarted.
[updates]
auto_install = true
check_interval_hours = 24
