manifest_version = 1
id = "native"
name = "Native toolchain lanes"
version = "0.2.0"
description = "Cargo and CMake/ctest jobs backed by Borg's engine-neutral lanes."
enabled = true
runtime_access = "sandboxed"
borg_version = ">=0.9.5"
skill_roots = ["skills"]

[workflows.native]
description = "Plan and submit a Cargo, CMake or ctest job through the Borg lane; returns the job ID."
entrypoint = "workflows/native.blu"

[api]
version = 1

[api.tools.run]
workflow = "native"
description = "Submit a Cargo/CMake/ctest lane job, e.g. `cargo test -p borg-agent-runtime`, `cmake build --target T`, `ctest test --regex R`, `postgres cargo test -p borg-agent-runtime`, `service start`. Add --dry-run to print the job spec. Returns the lane job ID immediately."
effect = "at_most_once"

[api.tools.run.input_schema]
type = "object"
required = ["arguments", "request_id"]

[api.tools.run.input_schema.properties.arguments]
type = "string"
description = "Adapter arguments as on a command line; raw Cargo/CMake/ctest flags go after `--`."

[api.tools.run.input_schema.properties.request_id]
type = "string"
description = "Fresh value per submission: identical arguments replay the earlier result instead of submitting again."

[api.commands.run]
workflow = "native"
description = "Submit a native lane job, e.g. /ext:native:run cargo test -p borg-agent-runtime"
