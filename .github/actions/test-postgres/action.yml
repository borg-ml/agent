name: Test Postgres
description: Provision an isolated CI server for per-test scratch databases
runs:
  using: composite
  steps:
    - uses: ankane/setup-postgres@b1a598d92f86cb2ed364411898d150d4eac6d5ca
      if: runner.os != 'Windows' || runner.arch != 'ARM64'
      with:
        user: postgres
    # The setup action rejects Windows ARM; Windows runs the x64 server under emulation.
    - name: Install Postgres on Windows ARM
      if: runner.os == 'Windows' && runner.arch == 'ARM64'
      shell: pwsh
      run: |
        $archive = Join-Path $env:RUNNER_TEMP "postgres-binaries.zip"
        Invoke-WebRequest "https://get.enterprisedb.com/postgresql/postgresql-17.9-3-windows-x64-binaries.zip" -OutFile $archive
        if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne "2E92B4CF07DFE29DBBBC26D5347B0BCAE18E5B3C0822BFAFF0BBC7F13B93D9AC") {
          throw "Postgres archive checksum mismatch"
        }
        $prefix = Join-Path $env:RUNNER_TEMP "postgres"
        Expand-Archive -Path $archive -DestinationPath $prefix
        $bin = Join-Path $prefix "pgsql/bin"
        $data = Join-Path $prefix "data"
        $passwordFile = Join-Path $prefix "password.txt"
        Set-Content -Path $passwordFile -Value "postgres" -Encoding ascii
        & "$bin/initdb.exe" -D $data -U postgres --encoding=UTF8 -A scram-sha-256 --pwfile=$passwordFile
        if ($LASTEXITCODE -ne 0) { throw "Test Postgres initialization failed" }
        Remove-Item $passwordFile
        $log = Join-Path $prefix "server.log"
        & "$bin/pg_ctl.exe" -D $data -l $log -o "-h 127.0.0.1 -p 5432" -w start
        if ($LASTEXITCODE -ne 0) {
          if (Test-Path $log) { Get-Content $log -Tail 100 }
          throw "Test Postgres startup failed"
        }
        $env:PGPASSWORD = "postgres"
        & "$bin/psql.exe" -h 127.0.0.1 -p 5432 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "SELECT version();"
        if ($LASTEXITCODE -ne 0) { throw "Test Postgres connection failed" }
