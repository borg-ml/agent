name: Borg Agent release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft release tag to rebuild
        required: true
        type: string

run-name: Release ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

env:
  BORG_TEST_SESSIONS_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
  BORG_SESSIONS_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: "1.98.0"
          components: rustfmt, clippy
      - name: Install quality tools
        run: cargo install --locked just cargo-deny cargo-audit
      - name: Install borg-display build dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev
      - uses: ./.github/actions/test-postgres
      - name: Run workspace verification
        run: just verify
      - name: Verify tag and release tooling
        shell: bash
        run: |
          ./scripts/sync-blu.sh --check
          ./scripts/release.sh --verify-tag "$RELEASE_TAG"
          ./scripts/release-test.sh

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar
          - os: macos-15
            target: aarch64-apple-darwin
            archive: tar
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: "1.98.0"
          targets: ${{ matrix.target }}
      - name: Build Borg Agent
        run: cargo build --locked --release --target ${{ matrix.target }} -p borg
      - name: Build the Linux private display
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev
          cargo build --locked --release --target ${{ matrix.target }} -p borg-display
      - uses: ./.github/actions/test-postgres
      - name: Run native Borg Agent core-flow tests
        run: cargo test --locked --target ${{ matrix.target }} -p borg --no-fail-fast -- --test-threads=4
      - name: Smoke-test the native Borg Agent binary
        shell: bash
        run: |
          binary="target/${{ matrix.target }}/release/borg"
          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            binary="${binary}.exe"
          fi
          "$binary" --version
          "$binary" --help >/dev/null
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            "target/${{ matrix.target }}/release/borg-display" --version
          fi
      - name: Install pinned native Claude payload
        shell: bash
        run: |
          npm --prefix packages/claude-native-runtime ci --omit=dev --ignore-scripts
      - name: Package Unix archive
        if: matrix.archive == 'tar'
        shell: bash
        run: |
          asset="borg-${{ matrix.target }}.tar.gz"
          package_dir="borg-${{ matrix.target }}"
          mkdir "$package_dir"
          cp "target/${{ matrix.target }}/release/borg" "$package_dir/"
          binaries=(borg)
          # Linux archives must carry the computer-use private display; the
          # self-updater installs it beside borg.
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            cp "target/${{ matrix.target }}/release/borg-display" "$package_dir/"
            binaries+=(borg-display)
          fi
          native_package=""
          for candidate in packages/claude-native-runtime/node_modules/@anthropic-ai/claude-agent-sdk-*; do
            if [[ -x "$candidate/claude" ]]; then
              native_package="$candidate"
              break
            fi
          done
          test -n "$native_package"
          sdk_package="packages/claude-native-runtime/node_modules/@anthropic-ai/claude-agent-sdk"
          mkdir -p "$package_dir/providers/claude"
          cp "$native_package/claude" "$package_dir/providers/claude/claude"
          cp "$native_package/LICENSE.md" "$package_dir/providers/claude/LICENSE.md"
          cp "$sdk_package/manifest.json" "$package_dir/providers/claude/manifest.json"
          cp "$sdk_package/package.json" "$package_dir/providers/claude/package.json"
          chmod 700 "$package_dir/providers/claude/claude"
          mkdir -p "$package_dir/docs" "$package_dir/configs" "$package_dir/include"
          cp docs/blu-extensions.md "$package_dir/docs/"
          cp docs/customization.md "$package_dir/docs/"
          cp docs/terminal-setup.md "$package_dir/docs/"
          cp configs/extension.example.toml "$package_dir/configs/"
          cp configs/ghostty-borg.conf "$package_dir/configs/"
          cp include/borg_extension.h "$package_dir/include/"
          cp LICENSE NOTICE.md README.md CHANGELOG.md "$package_dir/"
          tar -C "$package_dir" -czf "$PWD/$asset" "${binaries[@]}" providers docs configs include LICENSE NOTICE.md README.md CHANGELOG.md
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$asset" >"$asset.sha256"
          else
            shasum -a 256 "$asset" >"$asset.sha256"
          fi
      - name: Package Windows archive
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $asset = "borg-${{ matrix.target }}.zip"
          $packageDir = "borg-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $packageDir
          Copy-Item "target/${{ matrix.target }}/release/borg.exe" $packageDir
          $platformPackage = Get-ChildItem "packages/claude-native-runtime/node_modules/@anthropic-ai" -Directory |
            Where-Object { $_.Name -like "claude-agent-sdk-*" -and (Test-Path (Join-Path $_.FullName "claude.exe")) } |
            Select-Object -First 1
          if (-not $platformPackage) { throw "Claude native platform package was not installed" }
          $sdkPackage = "packages/claude-native-runtime/node_modules/@anthropic-ai/claude-agent-sdk"
          New-Item -ItemType Directory -Path "$packageDir/providers/claude"
          Copy-Item (Join-Path $platformPackage.FullName "claude.exe") "$packageDir/providers/claude/claude.exe"
          Copy-Item (Join-Path $platformPackage.FullName "LICENSE.md") "$packageDir/providers/claude/LICENSE.md"
          Copy-Item (Join-Path $sdkPackage "manifest.json") "$packageDir/providers/claude/manifest.json"
          Copy-Item (Join-Path $sdkPackage "package.json") "$packageDir/providers/claude/package.json"
          New-Item -ItemType Directory -Path "$packageDir/docs", "$packageDir/configs", "$packageDir/include"
          Copy-Item "docs/blu-extensions.md" "$packageDir/docs/"
          Copy-Item "docs/customization.md" "$packageDir/docs/"
          Copy-Item "docs/terminal-setup.md" "$packageDir/docs/"
          Copy-Item "configs/extension.example.toml" "$packageDir/configs/"
          Copy-Item "configs/ghostty-borg.conf" "$packageDir/configs/"
          Copy-Item "include/borg_extension.h" "$packageDir/include/"
          Copy-Item LICENSE, NOTICE.md, README.md, CHANGELOG.md $packageDir
          Compress-Archive -Path "$packageDir/*" -DestinationPath $asset
          $hash = (Get-FileHash -Algorithm SHA256 $asset).Hash.ToLowerInvariant()
          "$hash  $asset" | Set-Content -NoNewline "$asset.sha256"
      - name: Install-smoke the Unix archive
        if: matrix.archive == 'tar'
        shell: bash
        run: |
          smoke_dir="$(mktemp -d)"
          trap 'rm -rf "$smoke_dir"' EXIT
          tar -xzf "borg-${{ matrix.target }}.tar.gz" -C "$smoke_dir"
          binary="$(find "$smoke_dir" -type f -name borg -print -quit)"
          test -n "$binary"
          "$binary" --version
          native="$(find "$smoke_dir" -path '*/providers/claude/claude' -type f -print -quit)"
          test -n "$native"
          "$native" --version
          test -f "$(dirname "$binary")/providers/claude/LICENSE.md"
          test -f "$(dirname "$binary")/CHANGELOG.md"
          test -f "$(dirname "$binary")/docs/blu-extensions.md"
          test -f "$(dirname "$binary")/docs/customization.md"
          test -f "$(dirname "$binary")/docs/terminal-setup.md"
          test -f "$(dirname "$binary")/configs/extension.example.toml"
          test -f "$(dirname "$binary")/configs/ghostty-borg.conf"
          test -f "$(dirname "$binary")/include/borg_extension.h"
      - name: Install-smoke the Windows archive
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $smokeDir = Join-Path $PWD "package-smoke"
          if (Test-Path $smokeDir) { Remove-Item -Recurse -Force $smokeDir }
          Expand-Archive -Path "borg-${{ matrix.target }}.zip" -DestinationPath $smokeDir
          $binary = Get-ChildItem -Path $smokeDir -Recurse -Filter "borg.exe" | Select-Object -First 1
          if (-not $binary) { throw "packaged borg.exe was not found" }
          & $binary.FullName --version
          $native = Get-ChildItem -Path $smokeDir -Recurse -Filter "claude.exe" | Select-Object -First 1
          if (-not $native) { throw "packaged native claude.exe was not found" }
          & $native.FullName --version
          if (-not (Test-Path (Join-Path $binary.DirectoryName "providers/claude/LICENSE.md"))) { throw "Claude license was not packaged" }
          if (-not (Test-Path (Join-Path $binary.DirectoryName "CHANGELOG.md"))) { throw "Changelog was not packaged" }
          if (-not (Get-ChildItem -Path $smokeDir -Recurse -Filter "blu-extensions.md")) { throw "Blu documentation was not packaged" }
          if (-not (Get-ChildItem -Path $smokeDir -Recurse -Filter "customization.md")) { throw "Customization documentation was not packaged" }
          if (-not (Test-Path (Join-Path $binary.DirectoryName "docs/terminal-setup.md"))) { throw "Terminal setup guide was not packaged" }
          if (-not (Get-ChildItem -Path $smokeDir -Recurse -Filter "extension.example.toml")) { throw "Blu manifest example was not packaged" }
          if (-not (Test-Path (Join-Path $binary.DirectoryName "configs/ghostty-borg.conf"))) { throw "Ghostty configuration was not packaged" }
          if (-not (Get-ChildItem -Path $smokeDir -Recurse -Filter "borg_extension.h")) { throw "Native extension header was not packaged" }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: borg-${{ matrix.target }}
          path: |
            borg-${{ matrix.target }}.*

  stage_draft:
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: Prepare release notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if release_draft="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq .draft 2>release-lookup.err)"; then
            if [[ "$release_draft" != true ]]; then
              echo "Refusing to modify an already published release: $RELEASE_TAG" >&2
              exit 1
            fi
          elif ! grep -Fq 'HTTP 404' release-lookup.err; then
            cat release-lookup.err >&2
            exit 1
          fi
          python3 scripts/release-notes.py extract "${RELEASE_TAG#v}" CHANGELOG.md >release-notes.md
          previous_tag="$(git describe --tags --abbrev=0 "${RELEASE_TAG}^")"
          printf '\n[Full changelog](https://github.com/%s/compare/%s...%s)\n' "$GITHUB_REPOSITORY" "$previous_tag" "$RELEASE_TAG" >>release-notes.md
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: artifacts/*
          body_path: release-notes.md
          draft: true
