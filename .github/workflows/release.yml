name: Borg CLI release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify tag and release tooling
        shell: bash
        run: |
          ./scripts/release.sh --verify-tag "$GITHUB_REF_NAME"
          ./scripts/release-test.sh

  provider-parity:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: "1.94.0"
      - name: Run deterministic provider parity contracts
        shell: bash
        run: |
          cargo test --locked -p borg-provider provider::chat_stream::tests::codex_and_claude_normalize_mcp_tool_lifecycle_identically
          cargo test --locked -p borg-provider provider::chat_stream::tests::codex_and_claude_usage_maps_share_billing_buckets
          cargo test --locked -p borg-remote subagents::tests::every_execution_lane_exposes_the_same_borg_control_plane
          cargo test --locked -p borg-remote session::tests::active_provider_steer_uses_turn_control_across_provider_lanes
      - name: Check and build Claude Agent SDK adapter
        shell: bash
        run: |
          npm --prefix packages/borg-claude-sdk ci
          npm --prefix packages/borg-claude-sdk run check
          npm --prefix packages/borg-claude-sdk run build

  build:
    needs: [validate, provider-parity]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar
          - os: macos-15
            target: aarch64-apple-darwin
            archive: tar
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: "1.94.0"
          targets: ${{ matrix.target }}
      - name: Build CLI
        run: cargo build --locked --release --target ${{ matrix.target }} -p borg
      - name: Run native CLI core-flow tests
        run: cargo test --locked --target ${{ matrix.target }} -p borg --no-fail-fast
      - name: Smoke-test the native CLI binary
        shell: bash
        run: |
          binary="target/${{ matrix.target }}/release/borg"
          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            binary="${binary}.exe"
          fi
          "$binary" --version
          "$binary" --help >/dev/null
      - name: Build Claude Agent SDK adapter
        shell: bash
        run: |
          npm --prefix packages/borg-claude-sdk ci
          npm --prefix packages/borg-claude-sdk run check
          npm --prefix packages/borg-claude-sdk run build
          npm --prefix packages/borg-claude-sdk prune --omit=dev
      - name: Package Unix archive
        if: matrix.archive == 'tar'
        shell: bash
        run: |
          asset="borg-${{ matrix.target }}.tar.gz"
          package_dir="borg-${{ matrix.target }}"
          mkdir "$package_dir"
          cp "target/${{ matrix.target }}/release/borg" "$package_dir/"
          mkdir -p "$package_dir/providers"
          cp -R packages/borg-claude-sdk "$package_dir/providers/claude-sdk"
          cp LICENSE NOTICE.md README.md "$package_dir/"
          tar -C "$package_dir" -czf "$PWD/$asset" borg providers LICENSE NOTICE.md README.md
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$asset" >"$asset.sha256"
          else
            shasum -a 256 "$asset" >"$asset.sha256"
          fi
      - name: Package Windows archive
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $asset = "borg-${{ matrix.target }}.zip"
          $packageDir = "borg-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $packageDir
          Copy-Item "target/${{ matrix.target }}/release/borg.exe" $packageDir
          New-Item -ItemType Directory -Path "$packageDir/providers"
          Copy-Item -Recurse "packages/borg-claude-sdk" "$packageDir/providers/claude-sdk"
          Copy-Item LICENSE, NOTICE.md, README.md $packageDir
          Compress-Archive -Path "$packageDir/*" -DestinationPath $asset
          $hash = (Get-FileHash -Algorithm SHA256 $asset).Hash.ToLowerInvariant()
          "$hash  $asset" | Set-Content -NoNewline "$asset.sha256"
      - name: Install-smoke the Unix archive
        if: matrix.archive == 'tar'
        shell: bash
        run: |
          smoke_dir="$(mktemp -d)"
          trap 'rm -rf "$smoke_dir"' EXIT
          tar -xzf "borg-${{ matrix.target }}.tar.gz" -C "$smoke_dir"
          binary="$(find "$smoke_dir" -type f -name borg -print -quit)"
          test -n "$binary"
          "$binary" --version
      - name: Install-smoke the Windows archive
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $smokeDir = Join-Path $PWD "package-smoke"
          if (Test-Path $smokeDir) { Remove-Item -Recurse -Force $smokeDir }
          Expand-Archive -Path "borg-${{ matrix.target }}.zip" -DestinationPath $smokeDir
          $binary = Get-ChildItem -Path $smokeDir -Recurse -Filter "borg.exe" | Select-Object -First 1
          if (-not $binary) { throw "packaged borg.exe was not found" }
          & $binary.FullName --version
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: borg-${{ matrix.target }}
          path: |
            borg-${{ matrix.target }}.*

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: artifacts/*
          generate_release_notes: true
