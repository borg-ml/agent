name: Borg CLI release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify tag and release tooling
        shell: bash
        run: |
          ./scripts/release.sh --verify-tag "$GITHUB_REF_NAME"
          ./scripts/release-test.sh

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar
          - os: macos-15
            target: aarch64-apple-darwin
            archive: tar
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: "1.94.0"
          targets: ${{ matrix.target }}
      - name: Build CLI
        run: cargo build --locked --release --target ${{ matrix.target }} -p borg
      - name: Run native CLI core-flow tests
        run: cargo test --locked --target ${{ matrix.target }} -p borg --no-fail-fast
      - name: Smoke-test the native CLI binary
        shell: bash
        run: |
          binary="target/${{ matrix.target }}/release/borg"
          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            binary="${binary}.exe"
          fi
          "$binary" --version
          "$binary" --help >/dev/null
      - name: Install pinned native Claude payload
        shell: bash
        run: |
          npm --prefix packages/claude-native-runtime ci --omit=dev --ignore-scripts
      - name: Package Unix archive
        if: matrix.archive == 'tar'
        shell: bash
        run: |
          asset="borg-${{ matrix.target }}.tar.gz"
          package_dir="borg-${{ matrix.target }}"
          mkdir "$package_dir"
          cp "target/${{ matrix.target }}/release/borg" "$package_dir/"
          native_package=""
          for candidate in packages/claude-native-runtime/node_modules/@anthropic-ai/claude-agent-sdk-*; do
            if [[ -x "$candidate/claude" ]]; then
              native_package="$candidate"
              break
            fi
          done
          test -n "$native_package"
          mkdir -p "$package_dir/providers/claude"
          cp "$native_package/claude" "$package_dir/providers/claude/claude"
          cp "$native_package/manifest.json" "$package_dir/providers/claude/manifest.json"
          cp packages/claude-native-runtime/node_modules/@anthropic-ai/claude-agent-sdk/package.json "$package_dir/providers/claude/package.json"
          chmod 700 "$package_dir/providers/claude/claude"
          mkdir -p "$package_dir/docs" "$package_dir/configs"
          cp docs/blu-extensions.md "$package_dir/docs/"
          cp configs/extension.example.toml "$package_dir/configs/"
          cp LICENSE NOTICE.md README.md "$package_dir/"
          tar -C "$package_dir" -czf "$PWD/$asset" borg providers docs configs LICENSE NOTICE.md README.md
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$asset" >"$asset.sha256"
          else
            shasum -a 256 "$asset" >"$asset.sha256"
          fi
      - name: Package Windows archive
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $asset = "borg-${{ matrix.target }}.zip"
          $packageDir = "borg-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $packageDir
          Copy-Item "target/${{ matrix.target }}/release/borg.exe" $packageDir
          $platformPackage = Get-ChildItem "packages/claude-native-runtime/node_modules/@anthropic-ai" -Directory |
            Where-Object { $_.Name -like "claude-agent-sdk-*" -and (Test-Path (Join-Path $_.FullName "claude.exe")) } |
            Select-Object -First 1
          if (-not $platformPackage) { throw "Claude native platform package was not installed" }
          New-Item -ItemType Directory -Path "$packageDir/providers/claude"
          Copy-Item (Join-Path $platformPackage.FullName "claude.exe") "$packageDir/providers/claude/claude.exe"
          Copy-Item (Join-Path $platformPackage.FullName "manifest.json") "$packageDir/providers/claude/manifest.json"
          Copy-Item "packages/claude-native-runtime/node_modules/@anthropic-ai/claude-agent-sdk/package.json" "$packageDir/providers/claude/package.json"
          New-Item -ItemType Directory -Path "$packageDir/docs", "$packageDir/configs"
          Copy-Item "docs/blu-extensions.md" "$packageDir/docs/"
          Copy-Item "configs/extension.example.toml" "$packageDir/configs/"
          Copy-Item LICENSE, NOTICE.md, README.md $packageDir
          Compress-Archive -Path "$packageDir/*" -DestinationPath $asset
          $hash = (Get-FileHash -Algorithm SHA256 $asset).Hash.ToLowerInvariant()
          "$hash  $asset" | Set-Content -NoNewline "$asset.sha256"
      - name: Install-smoke the Unix archive
        if: matrix.archive == 'tar'
        shell: bash
        run: |
          smoke_dir="$(mktemp -d)"
          trap 'rm -rf "$smoke_dir"' EXIT
          tar -xzf "borg-${{ matrix.target }}.tar.gz" -C "$smoke_dir"
          binary="$(find "$smoke_dir" -type f -name borg -print -quit)"
          test -n "$binary"
          "$binary" --version
          native="$(find "$smoke_dir" -path '*/providers/claude/claude' -type f -print -quit)"
          test -n "$native"
          "$native" --version
          test -f "$(dirname "$binary")/docs/blu-extensions.md"
          test -f "$(dirname "$binary")/configs/extension.example.toml"
      - name: Install-smoke the Windows archive
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $smokeDir = Join-Path $PWD "package-smoke"
          if (Test-Path $smokeDir) { Remove-Item -Recurse -Force $smokeDir }
          Expand-Archive -Path "borg-${{ matrix.target }}.zip" -DestinationPath $smokeDir
          $binary = Get-ChildItem -Path $smokeDir -Recurse -Filter "borg.exe" | Select-Object -First 1
          if (-not $binary) { throw "packaged borg.exe was not found" }
          & $binary.FullName --version
          $native = Get-ChildItem -Path $smokeDir -Recurse -Filter "claude.exe" | Select-Object -First 1
          if (-not $native) { throw "packaged native claude.exe was not found" }
          & $native.FullName --version
          if (-not (Get-ChildItem -Path $smokeDir -Recurse -Filter "blu-extensions.md")) { throw "Blu documentation was not packaged" }
          if (-not (Get-ChildItem -Path $smokeDir -Recurse -Filter "extension.example.toml")) { throw "Blu manifest example was not packaged" }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: borg-${{ matrix.target }}
          path: |
            borg-${{ matrix.target }}.*

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: artifacts/*
          generate_release_notes: true
