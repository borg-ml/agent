name: Borg Agent platform CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: borg-agent-platform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: workspace quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: "1.98.0"
          components: rustfmt, clippy
      - name: Install quality tools
        run: cargo install --locked just cargo-deny cargo-audit
      - name: Run workspace verification
        run: just verify

  native:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar
          - os: macos-15
            target: aarch64-apple-darwin
            archive: tar
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: "1.98.0"
          targets: ${{ matrix.target }}
      - name: Install Linux GUI link dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev
      - name: Build Borg Agent
        run: cargo build --locked --release --target ${{ matrix.target }} -p borg -p borg-gui
      - name: Run native Borg Agent core-flow tests
        run: cargo test --locked --target ${{ matrix.target }} -p borg --no-fail-fast
      - name: Smoke-test the native Borg Agent binary
        shell: bash
        run: |
          binary="target/${{ matrix.target }}/release/borg"
          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            binary="${binary}.exe"
          fi
          "$binary" --version
          "$binary" --help >/dev/null
      - name: Install the pinned native Claude payload
        shell: bash
        run: npm --prefix packages/claude-native-runtime ci --omit=dev --ignore-scripts
      - name: Package and extract-smoke the Unix archive
        if: matrix.archive == 'tar'
        shell: bash
        run: |
          asset="borg-${{ matrix.target }}.tar.gz"
          stage="$(mktemp -d)"
          extract="$(mktemp -d)"
          trap 'rm -rf "$stage" "$extract"' EXIT
          mkdir "$stage/borg-${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/borg" "$stage/borg-${{ matrix.target }}/"
          cp "target/${{ matrix.target }}/release/borg-gui" "$stage/borg-${{ matrix.target }}/"
          native_package=""
          for candidate in packages/claude-native-runtime/node_modules/@anthropic-ai/claude-agent-sdk-*; do
            if [[ -x "$candidate/claude" ]]; then
              native_package="$candidate"
              break
            fi
          done
          test -n "$native_package"
          sdk_package="packages/claude-native-runtime/node_modules/@anthropic-ai/claude-agent-sdk"
          mkdir -p "$stage/borg-${{ matrix.target }}/providers/claude"
          cp "$native_package/claude" "$stage/borg-${{ matrix.target }}/providers/claude/claude"
          cp "$sdk_package/manifest.json" "$stage/borg-${{ matrix.target }}/providers/claude/manifest.json"
          cp "$sdk_package/package.json" "$stage/borg-${{ matrix.target }}/providers/claude/package.json"
          chmod 700 "$stage/borg-${{ matrix.target }}/providers/claude/claude"
          mkdir -p "$stage/borg-${{ matrix.target }}/docs" "$stage/borg-${{ matrix.target }}/configs" "$stage/borg-${{ matrix.target }}/include"
          cp docs/blu-extensions.md "$stage/borg-${{ matrix.target }}/docs/"
          cp configs/extension.example.toml "$stage/borg-${{ matrix.target }}/configs/"
          cp include/borg_extension.h "$stage/borg-${{ matrix.target }}/include/"
          tar -C "$stage" -czf "$asset" "borg-${{ matrix.target }}"
          tar -xzf "$asset" -C "$extract"
          "$extract/borg-${{ matrix.target }}/borg" --version
          test -x "$extract/borg-${{ matrix.target }}/borg-gui"
          "$extract/borg-${{ matrix.target }}/providers/claude/claude" --version
          test -f "$extract/borg-${{ matrix.target }}/docs/blu-extensions.md"
          test -f "$extract/borg-${{ matrix.target }}/configs/extension.example.toml"
          test -f "$extract/borg-${{ matrix.target }}/include/borg_extension.h"
      - name: Package and extract-smoke the Windows archive
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $asset = "borg-${{ matrix.target }}.zip"
          $stage = Join-Path $env:RUNNER_TEMP "borg-package-stage"
          $extract = Join-Path $env:RUNNER_TEMP "borg-package-extract"
          if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }
          if (Test-Path $extract) { Remove-Item -Recurse -Force $extract }
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/borg.exe" $stage
          Copy-Item "target/${{ matrix.target }}/release/borg-gui.exe" $stage
          $platformPackage = Get-ChildItem "packages/claude-native-runtime/node_modules/@anthropic-ai" -Directory |
            Where-Object { $_.Name -like "claude-agent-sdk-*" -and (Test-Path (Join-Path $_.FullName "claude.exe")) } |
            Select-Object -First 1
          if (-not $platformPackage) { throw "Claude native platform package was not installed" }
          $sdkPackage = "packages/claude-native-runtime/node_modules/@anthropic-ai/claude-agent-sdk"
          New-Item -ItemType Directory -Path "$stage/providers/claude"
          Copy-Item (Join-Path $platformPackage.FullName "claude.exe") "$stage/providers/claude/claude.exe"
          Copy-Item (Join-Path $sdkPackage "manifest.json") "$stage/providers/claude/manifest.json"
          Copy-Item (Join-Path $sdkPackage "package.json") "$stage/providers/claude/package.json"
          New-Item -ItemType Directory -Path "$stage/docs", "$stage/configs", "$stage/include"
          Copy-Item "docs/blu-extensions.md" "$stage/docs/"
          Copy-Item "configs/extension.example.toml" "$stage/configs/"
          Copy-Item "include/borg_extension.h" "$stage/include/"
          Compress-Archive -Path "$stage/*" -DestinationPath $asset
          Expand-Archive -Path $asset -DestinationPath $extract
          $binary = Get-ChildItem -Path $extract -Filter "borg.exe" | Select-Object -First 1
          if (-not $binary) { throw "packaged borg.exe was not found" }
          & $binary.FullName --version
          if (-not (Get-ChildItem -Path $extract -Filter "borg-gui.exe")) { throw "packaged borg-gui.exe was not found" }
          $native = Get-ChildItem -Path $extract -Recurse -Filter "claude.exe" | Select-Object -First 1
          if (-not $native) { throw "packaged native claude.exe was not found" }
          & $native.FullName --version
          if (-not (Get-ChildItem -Path $extract -Recurse -Filter "blu-extensions.md")) { throw "Blu documentation was not packaged" }
          if (-not (Get-ChildItem -Path $extract -Recurse -Filter "extension.example.toml")) { throw "Blu manifest example was not packaged" }
          if (-not (Get-ChildItem -Path $extract -Recurse -Filter "borg_extension.h")) { throw "Native extension header was not packaged" }
