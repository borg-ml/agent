[workspace]
members = [
    "crates/borg-core",
    "crates/borg-provider",
    "crates/borg-remote",
    "crates/borg-search",
    "crates/borg-cli",
]
resolver = "2"

[workspace.package]
version = "0.2.2"
edition = "2024"
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/borg-ml/agent"
homepage = "https://borg.ml"
authors = ["Borg contributors"]

[workspace.dependencies]
anyhow = "1.0.104"
agent-client-protocol = "2.0.0"
async-trait = "0.1.89"
base64 = "0.22.1"
borg-core = { path = "crates/borg-core" }
blu-lang = { git = "https://github.com/borg-ml/blu.git", rev = "9cf2a6b187d868471d50155ad37a5e5342006e66" }
claude-agents = { git = "https://github.com/borg-ml/claude-agents.git", rev = "0e41be9eed5ffe91b77b79c6742b192b0d917f07" }
chrono = { version = "0.4.42", features = ["serde"] }
borg-search = { path = "crates/borg-search" }
dirs = "6.0.0"
futures = "0.3"
ignore = "0.4"
libc = "0.2"
regex = "1"
reqwest = { version = "0.12.21", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["arbitrary_precision"] }
sha2 = "0.10.9"
sqlx = { version = "0.9.0", default-features = false, features = ["chrono", "json", "postgres", "runtime-tokio", "sqlite", "tls-rustls", "uuid"] }
tempfile = "3.23.0"
toml = "0.8.23"
tokio = { version = "1.48.0", features = ["full"] }
tokio-util = { version = "0.7.18", features = ["io"] }
tracing = "0.1.41"
ts-rs = { version = "12.0.1", features = ["chrono-impl", "serde-json-impl", "uuid-impl"] }
url = "2.5"
uuid = { version = "1.18.1", features = ["serde", "v4", "v5"] }
