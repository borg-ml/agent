[workspace]
members = [
    "crates/borg-provider",
    "crates/borg-remote",
    "crates/borg-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.29"
edition = "2024"
rust-version = "1.94"
license = "GPL-3.0-or-later"
repository = "https://github.com/borg-ml/cli"
homepage = "https://borg.ml"
authors = ["Borg contributors"]

[workspace.dependencies]
anyhow = "1.0.104"
agent-client-protocol = "2.0.0"
async-trait = "0.1.89"
base64 = "0.22.1"
chrono = { version = "0.4.42", features = ["serde"] }
futures = "0.3"
ignore = "0.4"
libc = "0.2"
regex = "1"
reqwest = { version = "0.12.21", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["arbitrary_precision"] }
sha2 = "0.10.9"
sqlx = { version = "0.8.6", default-features = false, features = ["chrono", "json", "postgres", "runtime-tokio-rustls", "sqlite", "uuid"] }
tempfile = "3.23.0"
toml = "0.8.23"
tokio = { version = "1.48.0", features = ["full"] }
tokio-util = { version = "0.7.18", features = ["io"] }
tracing = "0.1.41"
ts-rs = { version = "12.0.1", features = ["chrono-impl", "serde-json-impl", "uuid-impl"] }
url = "2.5"
uuid = { version = "1.18.1", features = ["serde", "v4", "v5"] }
