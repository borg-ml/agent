[workspace]
members = [
    "crates/borg-core",
    "crates/borg-dictation",
    "crates/borg-provider",
    "crates/borg-remote",
    "crates/borg-search",
    "crates/borg-ui",
    "crates/borg-tui",
    "crates/borg-gui",
    "crates/borg-cli",
]
resolver = "2"

[workspace.package]
version = "0.3.22"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/borg-ml/agent"
homepage = "https://borg.ml"
authors = ["Borg contributors"]

[workspace.dependencies]
anyhow = "1.0.104"
agent-client-protocol = "2.0.0"
async-trait = "0.1.92"
base64 = "0.23.1"
borg-core = { path = "crates/borg-core" }
borg-dictation = { path = "crates/borg-dictation" }
blu-lang = { git = "https://github.com/borg-ml/blu.git", rev = "801033966232cce081977d961324847adcf5497a" }
claude-agents = { git = "https://github.com/borg-ml/claude-agents.git", rev = "0e41be9eed5ffe91b77b79c6742b192b0d917f07" }
chrono = { version = "0.4.45", features = ["serde"] }
borg-search = { path = "crates/borg-search" }
borg-ui = { path = "crates/borg-ui" }
borg-tui = { path = "crates/borg-tui" }
dirs = "6.0.0"
futures = "0.3"
hex = "0.4"
ignore = "0.4"
libc = "0.2"
regex = "1"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "multipart", "query", "rustls", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["arbitrary_precision"] }
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["chrono", "json", "postgres", "runtime-tokio", "sqlite", "tls-rustls", "uuid"] }
tempfile = "3.27.0"
toml = "1.1.4"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = { version = "0.7.19", features = ["io"] }
tracing = "0.1.44"
ts-rs = { version = "12.0.1", features = ["chrono-impl", "serde-json-impl", "uuid-impl"] }
url = "2.5"
uuid = { version = "1.26.0", features = ["serde", "v4", "v5"] }
