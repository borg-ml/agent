[package]
name = "borg-view"
description = "Renderer-independent session view contracts for Borg frontends"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
borg-agent-runtime = { path = "../borg-agent-runtime", default-features = false }
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
ts-rs.workspace = true
uuid.workspace = true
anyhow.workspace = true
borg-provider = { path = "../borg-provider", default-features = false }
base64.workspace = true

[dev-dependencies]
borg-agent-runtime = { path = "../borg-agent-runtime", default-features = false, features = ["test-support"] }
async-trait.workspace = true
tempfile.workspace = true
tokio.workspace = true
