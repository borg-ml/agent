[package]
name = "borg"
description = "Borg Agent terminal client, agent harness, and Borg Remote host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false

[features]
default = ["subscription-adapters"]
subscription-adapters = [
    "borg-provider/subscription-adapters",
    "borg-remote/subscription-adapters",
]
profiling = ["borg-remote/profiling"]

[[bin]]
name = "borg"
path = "src/main.rs"

[dependencies]
agent-client-protocol.workspace = true
aes-gcm = "0.10.3"
anyhow.workspace = true
arboard = { version = "3.6", features = ["wayland-data-control"] }
base64.workspace = true
borg-provider = { path = "../borg-provider", default-features = false }
borg-remote = { path = "../borg-remote", default-features = false }
chrono.workspace = true
clap = { version = "4.5.53", features = ["derive"] }
crossterm = { version = "0.29", features = ["bracketed-paste", "event-stream"] }
futures-util = "0.3"
getrandom = "0.3.4"
image = { version = "0.25.9", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
libloading = "0.8.9"
pulldown-cmark = "0.13"
qrcode = { version = "0.14.1", default-features = false }
regex.workspace = true
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache", "macros", "underline-color"] }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
semver = "1"
sha2.workspace = true
shlex = "1.3"
syntect = { version = "5.2", default-features = false, features = ["default-syntaxes", "default-themes", "parsing", "regex-fancy"] }
term-maths = "1.0.0"
tempfile.workspace = true
tokio.workspace = true
tokio-tungstenite = { version = "0.28.0", features = ["rustls-tls-webpki-roots"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
toml = "0.8.23"
tracing.workspace = true
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
unicode-segmentation = "1.12"
unicode-width = "0.2"
url.workspace = true
urlencoding = "2.1.3"
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
dirs.workspace = true
flate2 = "1"
tar = "0.4"
libc.workspace = true

[target.'cfg(windows)'.dependencies]
dirs.workspace = true
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_Power",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }
zip = { version = "4", default-features = false, features = ["deflate"] }
