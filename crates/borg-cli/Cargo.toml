[package]
name = "borg"
description = "Durable coding-agent terminal client and Borg Remote host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "borg"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
arboard = { version = "3.6", features = ["wayland-data-control"] }
base64.workspace = true
borg-provider = { path = "../borg-provider" }
borg-remote = { path = "../borg-remote" }
chrono.workspace = true
clap = { version = "4.5.53", features = ["derive"] }
crossterm = { version = "0.29", features = ["bracketed-paste", "event-stream"] }
futures-util = "0.3"
image = { version = "0.25.9", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
pulldown-cmark = "0.13"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache", "macros", "underline-color"] }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
shlex = "1.3"
syntect = { version = "5.2", default-features = false, features = ["default-syntaxes", "default-themes", "parsing", "regex-fancy"] }
term-maths = "1.0.0"
tempfile.workspace = true
tokio.workspace = true
tokio-util = { version = "0.7", features = ["io", "rt"] }
toml = "0.8.23"
tracing.workspace = true
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
unicode-segmentation = "1.12"
unicode-width = "0.2"
url.workspace = true
urlencoding = "2.1.3"
uuid.workspace = true
