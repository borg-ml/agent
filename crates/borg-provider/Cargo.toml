[package]
name = "borg-provider"
description = "Provider-neutral model, tool, MCP, authentication, usage, and agent adapters for Borg"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false

[features]
default = []
codex = []
claude = ["dep:claude-agents"]
subscription-adapters = ["codex", "claude"]

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
borg-core.workspace = true
claude-agents = { workspace = true, optional = true }
chrono.workspace = true
flate2.workspace = true
futures = "0.3"
getrandom = "0.4"
hex.workspace = true
libc = "0.2"
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar.workspace = true
tempfile.workspace = true
tokio.workspace = true
toml = "1.1.4"
tracing.workspace = true
uuid.workspace = true


[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Pipes"] }
