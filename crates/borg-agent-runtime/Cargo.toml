[package]
name = "borg-agent-runtime"
description = "Borg agent loop, tool dispatch, code-mode runtimes, session store, and orchestration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false

[features]
default = ["subscription-adapters"]
subscription-adapters = ["borg-provider/codex", "borg-provider/claude"]
profiling = []
test-support = []

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
blu-lang.workspace = true
borg-core.workspace = true
borg-lanes = { path = "../borg-lanes" }
borg-provider = { path = "../borg-provider", default-features = false }
borg-search.workspace = true
chrono.workspace = true
chrono-tz = "0.10"
dirs.workspace = true
futures.workspace = true
hex.workspace = true
ignore.workspace = true
libc.workspace = true
regex.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
tempfile.workspace = true
toml.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
ts-rs.workspace = true
url.workspace = true
uuid.workspace = true
zstd.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[target.'cfg(target_os = "linux")'.dependencies]
atspi = { version = "0.30", default-features = false, features = ["proxies"] }
evdev = "0.13"
memchr = "2"
# Blocking proxies keep the worker a plain synchronous request loop.
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
unicode-properties = { version = "0.1.4", default-features = false, features = ["general-category"] }
image = { version = "0.25.10", default-features = false, features = ["png", "pnm"] }
