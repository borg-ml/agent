[package]
name = "borg-remote"
description = "Durable local and remote agent session protocol, store, host, and tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false

[features]
default = ["subscription-adapters"]
subscription-adapters = ["borg-agent-runtime/subscription-adapters", "borg-provider/codex", "borg-provider/claude"]
profiling = ["borg-agent-runtime/profiling"]

[[example]]
name = "codex_native_probe"
required-features = ["subscription-adapters"]

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
borg-agent-runtime = { path = "../borg-agent-runtime", default-features = false }
borg-provider = { path = "../borg-provider", default-features = false }
chrono.workspace = true
futures.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
tempfile.workspace = true
tokio.workspace = true
tracing.workspace = true
url.workspace = true
uuid.workspace = true

[dev-dependencies]
borg-agent-runtime = { path = "../borg-agent-runtime", default-features = false, features = ["test-support"] }
