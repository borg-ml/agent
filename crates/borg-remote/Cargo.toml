[package]
name = "borg-remote"
description = "Durable local and remote agent session protocol, store, host, and tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false

[features]
default = ["subscription-adapters"]
subscription-adapters = ["borg-agent-runtime/subscription-adapters", "borg-provider/codex", "borg-provider/claude"]
profiling = ["borg-agent-runtime/profiling"]

[[example]]
name = "codex_native_probe"
required-features = ["subscription-adapters"]

[dependencies]
anyhow.workspace = true
base64.workspace = true
ed25519-dalek = "2"
async-trait.workspace = true
axum = { version = "0.8", features = ["ws", "http1"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
rustls = "0.23"
rustls-pemfile = "2"
rustls-native-certs = "0.8"
borg-agent-runtime = { path = "../borg-agent-runtime", default-features = false }
borg-view = { path = "../borg-view" }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
borg-provider = { path = "../borg-provider", default-features = false }
chrono.workspace = true
futures.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
tempfile.workspace = true
tokio.workspace = true
tracing.workspace = true
url.workspace = true
uuid.workspace = true

[dev-dependencies]
borg-agent-runtime = { path = "../borg-agent-runtime", default-features = false, features = ["test-support"] }
